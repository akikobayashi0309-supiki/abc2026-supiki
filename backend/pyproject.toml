[project]
name = "api"
version = "0.1.0"
description = "Cloud Run API: Gemini (Vertex AI) + Firestore"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.5",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
